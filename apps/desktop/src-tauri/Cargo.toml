[package]
name = "codepulse"
version = "1.0.0"
description = "Beautiful, privacy-first code analysis tool"
authors = ["CodePulse Team"]
license = "MIT"
repository = "https://github.com/AdlarX9/code-pulse"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open", "dialog-open", "dialog-save", "fs-read-dir", "fs-read-file", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
encoding_rs = "0.8"
regex = "1.10"
lazy_static = "1.4"
rayon = "1.8"
tokio = { version = "1.36", features = ["full"] }
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.6", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
