version: '3.8'

services:
    # PostgreSQL Database
    postgres:
        image: postgres:15-alpine
        container_name: codepulse-postgres
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./apps/api/migrations:/docker-entrypoint-initdb.d
        networks:
            - backend
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
            interval: 10s
            timeout: 5s
            retries: 5

    # Redis for caching
    redis:
        image: redis:7-alpine
        container_name: codepulse-redis
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - backend
        restart: unless-stopped

    # Go API
    api:
        build:
            context: ./apps/api
            dockerfile: Dockerfile
        container_name: codepulse-api
        environment:
            - ENV=production
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - REDIS_URL=redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - JWT_SECRET=${JWT_SECRET}
            - PORT=8080
        networks:
            - backend
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
            interval: 30s
            timeout: 10s
            retries: 3

    # Next.js Web App
    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
        container_name: codepulse-web
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
        networks:
            - frontend
        depends_on:
            - api
        restart: unless-stopped

    # Nginx Reverse Proxy with HTTPS
    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: codepulse-nginx
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs:ro
            - ./nginx/html:/usr/share/nginx/html:ro
        networks:
            - frontend
            - backend
        depends_on:
            - web
            - api
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:

networks:
    frontend:
        name: codepulse-frontend
    backend:
        name: codepulse-backend
