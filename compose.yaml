version: '3.8'

services:
    # Next.js Web App
    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: codepulse-web
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
        networks:
            - frontend
        depends_on:
            - api
        restart: unless-stopped

    # Nginx Reverse Proxy with HTTPS
    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: codepulse-nginx
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs:ro
            - ./nginx/html:/usr/share/nginx/html:ro
        networks:
            - frontend
            - backend
        depends_on:
            - web
            - api
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:

networks:
    frontend:
        name: codepulse-frontend
    backend:
        name: codepulse-backend
