name: Tauri Windows Build

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-windows:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Enable Corepack
              run: corepack enable

            - name: Install pnpm (fallback to npm)
              shell: bash
              run: |
                  set -e
                  if [ -f pnpm-lock.yaml ]; then
                    corepack prepare pnpm@latest --activate || npm i -g pnpm || true
                    if command -v pnpm >/dev/null 2>&1; then
                      pnpm install --frozen-lockfile || pnpm install
                    else
                      npm ci || npm install
                    fi
                  elif [ -f yarn.lock ]; then
                    corepack prepare yarn@stable --activate || npm i -g yarn || true
                    if command -v yarn >/dev/null 2>&1; then
                      yarn install --frozen-lockfile || yarn install
                    else
                      npm ci || npm install
                    fi
                  else
                    npm ci || npm install
                  fi

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Install Tauri CLI
              run: npm i -D @tauri-apps/cli

            - name: Build (NSIS by default)
              run: npx tauri build --bundles nsis

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-artifacts
                  path: |
                      src-tauri/target/release/bundle/**/*.exe
                      src-tauri/target/release/bundle/**/*.msi
                  if-no-files-found: warn
