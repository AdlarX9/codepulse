name: Deploy API

on:
    push:
        branches: [main, production]
        paths:
            - 'apps/api/**'
            - '.github/workflows/api-deploy.yml'
    pull_request:
        branches: [main]
        paths:
            - 'apps/api/**'

env:
    GO_VERSION: '1.21'
    DOCKER_REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}/api

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: testpass
                    POSTGRES_DB: codepulse_test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}

            - name: Cache Go modules
              uses: actions/cache@v3
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Install dependencies
              working-directory: ./apps/api
              run: go mod download

            - name: Run linter
              working-directory: ./apps/api
              run: |
                  go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
                  golangci-lint run

            - name: Run tests
              working-directory: ./apps/api
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: postgres
                  DB_PASSWORD: testpass
                  DB_NAME: codepulse_test
                  JWT_SECRET: test-secret
              run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

            - name: Upload coverage
              uses: codecov/codecov-action@v3
              with:
                  file: ./apps/api/coverage.out
                  flags: api

    build:
        needs: test
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.DOCKER_REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix={{branch}}-
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: ./apps/api
                  file: ./apps/api/Dockerfile.prod
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    deploy:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/production'
        environment:
            name: production
            url: https://api.codepulse.dev

        steps:
            - name: Deploy to production
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                      cd /opt/codepulse
                      docker-compose pull api
                      docker-compose up -d api
                      docker system prune -f

            - name: Health check
              run: |
                  sleep 10
                  curl --fail https://api.codepulse.dev/health || exit 1

            - name: Notify deployment
              uses: slackapi/slack-github-action@v1.24.0
              with:
                  webhook-url: ${{ secrets.SLACK_WEBHOOK }}
                  payload: |
                      {
                        "text": "✅ API deployed to production successfully",
                        "blocks": [
                          {
                            "type": "section",
                            "text": {
                              "type": "mrkdwn",
                              "text": "*API Deployment*\n✅ Deployed to production\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
                            }
                          }
                        ]
                      }
