[package]
name = "codepulse-ci-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ci-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
rayon = "1.8"
regex = "1.10"
glob = "0.3"
sha2 = "0.10"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
